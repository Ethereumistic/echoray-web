services:
  webscan:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_SECRET_KEY=${API_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONVEX_URL=${CONVEX_URL}
      - CONVEX_DEPLOY_KEY=${CONVEX_DEPLOY_KEY}
      - LIGHTHOUSE_THROTTLING=false
      - LIGHTHOUSE_TIMEOUT=120000
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
